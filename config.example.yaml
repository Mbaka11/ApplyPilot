# ApplyPilot configuration.
# Copied to config.yaml on first start. config.yaml is private and excluded from Git.

server:
  host: 127.0.0.1 # Never expose the server to the network.
  port: 4317

# Folder containing your CV PDFs. For X.pdf, ApplyPilot also looks for
# X/main.tex or X.tex; the model reads that source to understand your experience.
cvDir: ~/Documents/CV

# Optional CV variant metadata:
#  - language: fr / en (otherwise inferred from filenames: _FR, _EN, (ENG), etc.)
#  - default: general-purpose variant for this language
#  - tags: keywords that favor a specialized variant when found in the posting
cvs:
  - file: My_CV_FR.pdf
    language: fr
    label: General CV (FR)
    default: true
  - file: My_CV_EN.pdf
    language: en
    label: General CV (EN)
    default: true
  # - file: My_CV_EN_Finance.pdf
  #   language: en
  #   label: Finance CV (EN)
  #   tags: [quant, finance, trading, risk, portfolio, risque, portefeuille]
  #   hidden: false

# Reference letters (.txt / .md) for tone and structure guidance.
styleDir: data/style

llm:
  # claude | pi. Blank = claude when the Claude Code CLI is found, otherwise pi.
  provider: claude
  timeoutSeconds: 300 # The panel separately limits pending autofill answers to 90 seconds.
  # Claude Code CLI in headless mode (no tools, no session, no CLAUDE.md/skills/hooks/MCP).
  # Uses your existing Claude login (subscription): run `claude` once and sign in.
  # Warning: if ANTHROPIC_API_KEY is set in your environment, the CLI bills the API instead.
  claude:
    command: "" # Blank = claude.exe, then claude.cmd, from PATH. Or the full path to claude.exe.
    model: claude-sonnet-5-5
    effort: # Requested: low | medium | high | xhigh | max. The effective level is not reported.
      letter: medium
      answers: medium
      tailor: medium
  # pi (optional alternative). The former flat keys llm.command / model / letterThinking /
  # answersThinking are still read as pi settings when pi.* is absent.
  pi:
    command: pi # Standard installation, or the full path to a launcher.
    model: "" # Blank = pi's saved default when readable, otherwise pi selects. Final model is recorded separately.
    letterThinking: medium # Requested: off | minimal | low | medium | high | xhigh | max. Effective level is not reported.
    answersThinking: low

chrome:
  executablePath: "" # Blank = auto-detect Chrome, then Edge.

letter:
  paper: Letter # Letter or A4
  showHeader: true # Name and contact header
  showDate: true
  showRecipient: true
  city: "" # Blank = profile city
  maxWords: 380
  fileNameFr: "{first}_{last}_Lettre_de_motivation_{company}.pdf"
  fileNameEn: "{first}_{last}_Cover_Letter_{company}.pdf"

fill:
  # Also attach the letter to a CV field when it accepts multiple files
  # and there is no dedicated cover-letter field.
  attachLetterWithCv: true
  # Neutral upload name ({first}, {last}, {lang}); avoids exposing a targeted variant
  # such as CV_EN_Finance.pdf. Blank = keep the original filename.
  cvFileName: "{first}_{last}_CV.pdf"

# Per-posting CV tailoring (optional). Leave empty to find pdflatex on PATH / MiKTeX.
# cvTailor:
#   pdflatex: C:/Users/you/AppData/Local/Programs/MiKTeX/miktex/bin/x64/pdflatex.exe
