<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workday — My Experience</title>
<style>
  body { font: 14px sans-serif; padding: 20px; }
  [data-automation-id^="formField"] { margin: 8px 0; }
  label { display: block; font-weight: 600; }
  [role="group"] { border: 1px solid #ddd; padding: 8px; margin: 8px 0; }
  .popup { position: absolute; top: 60px; left: 500px; background: #fff; border: 1px solid #999; padding: 4px; list-style: none; z-index: 9; }
  .popup [role="option"] { padding: 3px 8px; }
</style>
<script src="mock.js"></script>
</head>
<body>
<div data-automation-id="applyFlowPage">
  <div data-automation-id="progressBarActiveStep">current step 2 of 5 My Experience</div>
  <h2>My Experience</h2>

  <div data-automation-id="workExperienceSection" id="workSection">
    <h3>Work Experience</h3>
    <div class="entries"></div>
    <button type="button" data-automation-id="Add" id="addWork">Add</button>
  </div>

  <div data-automation-id="educationSection" id="eduSection">
    <h3>Education</h3>
    <div class="entries"></div>
    <button type="button" data-automation-id="Add" id="addEdu">Add</button>
  </div>

  <div data-automation-id="skillsSection" id="skillsSection">
    <h3>Skills</h3>
  </div>

  <div data-automation-id="resumeSection">
    <h3>Resume/CV</h3>
    <input type="file" multiple data-automation-id="file-upload-input-ref" style="opacity:0;position:absolute;width:1px;height:1px">
    <div data-automation-id="file-upload-drop-zone">Drop files here</div>
    <ul id="uploaded"></ul>
  </div>

  <div data-automation-id="websiteSection">
    <h3>Social Network URLs</h3>
    <div data-automation-id="formField-linkedInAccount"><label>LinkedIn</label><input type="text" id="socialNetworkAccounts--linkedInAccount"></div>
  </div>
</div>
<script>
  let wn = 0;
  document.getElementById('addWork').addEventListener('click', () => {
    wn++;
    const g = document.createElement('div');
    g.setAttribute('role', 'group');
    g.setAttribute('aria-labelledby', `we-${wn}`);
    g.innerHTML = `<h4 id="we-${wn}">Work Experience ${wn}</h4>`;
    document.querySelector('#workSection .entries').appendChild(g);
    Mock.field(g, { id: 'jobTitle', label: 'Job Title*', html: `<input type="text" id="workExperience-${40 + wn}--jobTitle">` });
    Mock.field(g, { id: 'companyName', label: 'Company*', html: `<input type="text" id="workExperience-${40 + wn}--companyName">` });
    Mock.field(g, { id: 'location', label: 'Location', html: `<input type="text" id="workExperience-${40 + wn}--location">` });
    Mock.field(g, { id: 'currentlyWorkHere', label: 'I currently work here', html: `<input type="checkbox" id="workExperience-${40 + wn}--currentlyWorkHere">` });
    Mock.dateField(g, 'startDate', 'From*');
    Mock.dateField(g, 'endDate', 'To*');
    Mock.field(g, { id: 'roleDescription', label: 'Role Description', html: `<textarea id="workExperience-${40 + wn}--roleDescription"></textarea>` });
    g.querySelectorAll('input[type="text"], textarea').forEach(Mock.controlled);
  });

  let en = 0;
  document.getElementById('addEdu').addEventListener('click', () => {
    en++;
    const g = document.createElement('div');
    g.setAttribute('role', 'group');
    g.setAttribute('aria-labelledby', `ed-${en}`);
    g.innerHTML = `<h4 id="ed-${en}">Education ${en}</h4>`;
    document.querySelector('#eduSection .entries').appendChild(g);
    Mock.promptField(g, 'schoolName', 'School or University*', ['Polytechnique Montréal', 'Université de Montréal', 'McGill University', 'Korea University', 'Concordia University']);
    Mock.dropdownField(g, 'degree', 'Degree*', ["Bachelor's Degree", "Master's Degree", 'Doctorate', 'Other']);
    Mock.promptField(g, 'fieldOfStudy', 'Field of Study', ['Machine Learning', 'Computer Science', 'Software Engineering', 'Computer Engineering', 'Mathematics']);
    Mock.field(g, { id: 'gradeAverage', label: 'Overall Result (GPA)', html: '<input type="text">' });
    Mock.dateField(g, 'firstYearAttended', 'From', { month: false });
    Mock.dateField(g, 'lastYearAttended', 'To (Actual or Expected)', { month: false });
    g.querySelectorAll('input[type="text"]:not([data-uxi-widget-type])').forEach(Mock.controlled);
  });

  // Compétences : recherche multi-sélection (« Type to Add Skills »), libellés Workday plus longs que le profil.
  Mock.promptField(document.getElementById('skillsSection'), 'skills', 'Type to Add Skills',
    ['Python (Programming Language)', 'PyTorch (Machine Learning Library)', 'SQL (Programming Language)', 'NoSQL', 'Java', 'JavaScript'], { multi: true });

  const file = document.querySelector('[data-automation-id="file-upload-input-ref"]');
  file.addEventListener('change', () => {
    for (const f of file.files) {
      const li = document.createElement('li');
      li.textContent = `${f.name} (${f.size} o)`;
      document.getElementById('uploaded').appendChild(li);
    }
    file.value = ''; // Workday vide l'input après l'envoi
  });
</script>
</body>
</html>
