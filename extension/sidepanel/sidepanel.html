<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ApplyPilot</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand"><img src="../icons/icon32.png" alt="" /><span>ApplyPilot</span><span id="appVersion" class="version" title="Extension version">…</span></div>
      <button id="serverStatus" class="status" data-action="recheck" title="Recheck the server connection">…</button>
    </header>
    <div class="language-bar">
      <button type="button" id="headerStop" class="btn danger hidden" data-action="stopFill">Stop</button>
      <button type="button" id="headerSearchStop" class="btn danger hidden">Stop search</button>
      <label id="uiLanguageLabel" for="uiLanguage">Interface language</label>
      <select id="uiLanguage"><option value="en">English</option><option value="fr">Français</option></select>
    </div>

    <nav class="tabs">
      <button data-tab="app" class="active">Application</button>
      <button data-tab="search">Search</button>
      <button data-tab="journal">Tracker</button>
      <button data-tab="profile">Profile</button>
    </nav>

    <main>
      <section id="tab-app" class="tab active">
        <div id="offline" class="card warn hidden"></div>
        <div id="pageCard" class="card"></div>
        <div id="appCard" class="card"></div>
        <div id="letterCard" class="card"></div>
        <div id="fillCard" class="card"></div>
      </section>
      <section id="tab-search" class="tab"></section>
      <section id="tab-journal" class="tab"></section>
      <section id="tab-profile" class="tab"></section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
