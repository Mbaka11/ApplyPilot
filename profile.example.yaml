# ApplyPilot profile: information you would otherwise enter on every application.
# Copied to profile.yaml on first start. profile.yaml is PRIVATE and excluded from Git.
# Replace these examples with your own verified facts before autofilling any real form.
# Blank ("") or null means unknown / do not fill automatically.
# FR/EN matching values below are intentional; interface language never rewrites them.

headline: Software engineering student — Data Science / ML
summary: >-
  Your short introduction (2–3 sentences), reused by the model.

identity:
  firstName: First
  lastName: Last
  preferredName: ""
  email: first.last@example.com
  phone: "514-555-0123"
  phoneCountryCode: "+1"
  phoneCountry: Canada
  phoneType: Mobile
  address:
    line1: ""
    line2: ""
    city: Montréal
    province: Québec
    provinceCode: QC
    postalCode: ""
    country: Canada

links:
  linkedin: https://www.linkedin.com/in/your-profile/
  github: https://github.com/your-account
  portfolio: ""

# Eligibility: true / false / null (null = answer manually).
workAuthorization:
  citizenship: ""
  canada:
    authorizedToWork: null
    needsSponsorship: null
    status: "" # e.g. citizen, permanent resident, study permit + co-op work permit
  us:
    authorizedToWork: null
    needsSponsorship: null

student:
  currentlyEnrolled: true # Example only: confirm your own enrollment.
  program: Baccalauréat en génie logiciel (Polytechnique Montréal)
  programEn: Bachelor of Software Engineering (Polytechnique Montréal)
  level: Baccalauréat
  expectedGraduation: "" # YYYY-MM
  returningToSchoolAfterInternship: null
  creditedInternship: null # true only if your program credits this internship

# Additional attachments: full paths. Attach only a transcript you have verified.
documents:
  transcript: "" # e.g. C:/Users/you/Documents/transcript.pdf

availability:
  term: "" # e.g. Été 2027 (French value)
  termEn: "" # e.g. Summer 2027 (English value)
  startDate: "" # YYYY-MM-DD
  endDate: ""
  durationMonths: null
  fullTime: true # Example only: confirm your own availability.
  willingToRelocate: null
  workMode: "" # on-site / hybrid / remote

preferences:
  howDidYouHear: LinkedIn
  howDidYouHearAlternatives: [LinkedIn, Job Board, Company Website, Site carrière de l'entreprise, Internet, Social Media]
  salaryExpectation: ""
  referral: ""

# Example standard answers: verify each one before using your profile.
standardAnswers:
  over18: true
  relativesAtCompany: false
  nonCompete: false
  conflictOfInterest: false
  willingToTravel: null

# Voluntary disclosures: "prefer not" selects the option declining to answer.
voluntaryDisclosures:
  gender: prefer not
  pronouns: prefer not
  ethnicity: prefer not
  visibleMinority: prefer not
  indigenous: prefer not
  disability: prefer not
  veteran: prefer not
  sexualOrientation: prefer not

# Most recent first, matching Workday's order. Sample education, not your facts.
education:
  - school: Polytechnique Montréal
    schoolSearch: [Polytechnique Montréal, École Polytechnique de Montréal]
    degree: Baccalauréat en génie logiciel
    degreeEn: Bachelor of Software Engineering
    degreeLevel: [Bachelor's Degree, Baccalauréat, Bachelor]
    fieldOfStudy: Software Engineering
    fieldOfStudySearch: [Software Engineering, Génie logiciel, Computer Science]
    start: 2022-09
    end: 2026-05
    current: true
    gpa: ""
    location: Montréal, Canada

experience:
  - title: Software Developer Intern
    company: Example Company
    companyAliases: []
    location: "" # Professional location; never inferred from your home city.
    start: 2025-05
    end: 2025-08
    current: false
    description: One sentence describing an accomplishment.
    technologies: [Python]

projects:
  - name: Personal project
    url: ""
    description: ""

skills: [Python, SQL, Git]

languages:
  - language: Français
    languageEn: French
    level: "" # native / fluent / advanced / intermediate / basic (FR synonyms also supported)
  - language: Anglais
    languageEn: English
    level: "" # Do not infer proficiency from your interface language.

letter:
  signatureName: First Last
  tone: professional, direct and concrete, without clichés
  extraInstructions: ""
